<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Látványosságok - Feltöltés</title>
</head>
<body onload="javascript:telepulesekOption(); javascript:allLatvanyossagokTabla();">
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><u>Látványosságok</u> - Feltöltés</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
            <a class="nav-link" href="../">Főoldal</a>
            </li>
            <li class="nav-item">
            <a class="nav-link active" href="">Feltöltés</a>
            </li>
        </ul>
        </div>
    </div>
    </nav>
    <main class="mt-5">
          <section>
              <table class="table table-striped table-responsive">
              <thead class="thead-dark">
                  <tr>
                      <th scope="col">Név</th>
                      <th scope="col">Rövid leírás</th>
                      <th scope="col">Ország: Település</th>
                      <th scope="col">Átlag értékelés</th>
                      <th scope="col">Nyitvatartás</th>
                      <th scope="col">URL</th>
                      
                  </tr>
              </thead>
              <tbody class="latvanyossagokTabla" >
              </tbody>
              <tbody >
                  
                  <tr class="align-middle">
                      <form action="" method="POST">
                      <td><input type="text" name="nev" id="nev"></td>
                      <td><input type="text" name="rleiras" id="rleiras"></td>
                      <td>
                          <select name="telepulesek" id="telepulesek">
                          </select>     
                      </td>
                      <td><input type="number" name="atlagErtekeles" id="atlagErtekeles" min="0" max="5.0"></td>
                      <td><input type="text" name="nyitvatartas" id="nyitvatartas" placeholder="H-P: 07-19, SZ: 10-14, V: zárva"></td>
                      <td><input type="url" name="url" id="url"></td>
                      <td>
                          <button class="btn btn-success" type="submit">+</button>   
                      </td>
                      </form>
                  </tr>
                  
                  </tbody>
              </table>
          </section>
      </main>
      
      
      
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="../js/latvanyossagok.js"></script>
    </section>
  </main>
</body>
</html>
